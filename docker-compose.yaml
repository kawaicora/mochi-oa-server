# mochioa-server —— 一键启动：MySQL + 服务端
# 用法：docker compose up -d
# 变量可用 .env 覆盖（MYSQL_ROOT_PASSWORD / JWT_SECRET / TRANSPORTS 等）

services:
  mochi-oa-mysql-2f8e9c:
    image: mysql:8.0
    container_name: mochi-oa-mysql-2f8e9c
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mochioa_root_pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mochioa}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    # ports:
    #   - "3306:3306"

  mochi-oa-server-2f8e9c:
    build: .
    container_name: mochi-oa-server-2f8e9c
    restart: unless-stopped
    depends_on:
      mochi-oa-mysql-2f8e9c:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      TRANSPORTS: ${TRANSPORTS:-websocket,polling}
      # 部署在 Cloudflare 等只放行 HTTP/HTTPS 的场景：TRANSPORTS=polling
      TRUST_PROXY: ${TRUST_PROXY:-false}
      STORAGE: mysql
      MYSQL_HOST: mochi-oa-mysql-2f8e9c
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mochioa_root_pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mochioa}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      # WebRTC ICE 服务器：JSON 数组或逗号分隔 stun/turn URL（默认公共 Google STUN）
      ICE_SERVERS: ${ICE_SERVERS:-stun:stun.l.google.com:19302}
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 服务器管理员（SERVER_ADMIN）：逗号分隔用户名，基于用户、与公司/群角色无关；留空回退 ADMIN_USER
      SERVER_ADMIN_USERS: ${SERVER_ADMIN_USERS:-}
      # 主邮件（环境级，第一优先级）：配置了 MAIL_HOST 即启用；未配则由客户端(SERVER_ADMIN)在设置里写入
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_SECURE: ${MAIL_SECURE:-true}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      # 文件默认本地存储，由服务端 /files/* HTTP 提供（url 按请求 host 拼，客户端可直接显示）
      # 宿主 ./data 挂载到容器 /app/data；结构 {公司id|default}/{原始文件名/文件夹结构}，目录将来可挂独立硬盘
      FILE_DIR: ${FILE_DIR:-/app/data}
      FILE_MAX_BYTES: ${FILE_MAX_BYTES:-20971520}
      # 文件 URL 相对路径开关：true=对外返回 /files/...（默认，便于迁移）；false=用 FILE_BASE_URL 拼绝对 URL 返回。数据库始终存相对路径
      USE_RELATIVE_FILE_URL: ${USE_RELATIVE_FILE_URL:-true}
      # 绝对 URL 拼接源（origin，不带 /files），如 http://192.168.2.57；USE_RELATIVE_FILE_URL=false 时生效
      FILE_BASE_URL: ${FILE_BASE_URL:-}
      # Cloudflare TURN API（ICE_USE_CLOUDFLARE=true 时启用，覆盖静态 ICE_SERVERS）
      ICE_USE_CLOUDFLARE: ${ICE_USE_CLOUDFLARE:-false}
      CLOUDFLARE_TURN_TOKEN: ${CLOUDFLARE_TURN_TOKEN:-}
      CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:-}
      ICE_SERVERS_TOKEN_SECOND: ${ICE_SERVERS_TOKEN_SECOND:-86400}
    volumes:
      - ./data:/app/data
    ports:
      - "${SERVER_PORT:-3000}:3000"

volumes:
  mysql_data:
